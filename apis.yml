aid: novee-security
name: Novee Security
description: >-
  Novee Security (Novee) is a cybersecurity company delivering AI-driven
  penetration testing that finds vulnerabilities faster, validates defenses, and
  reduces cyber risk. Its autonomous offensive-security platform performs
  penetration testing at machine speed across web applications and APIs, and
  spans solutions including DAST, AI red teaming, manual penetration testing, bug
  bounty, and compliance testing. Backed by Canaan Partners, Novee is building
  continuous, AI-native security testing as an alternative to traditional DAST
  scanning and slow, periodic manual pentest cycles. The company publishes a
  marketing and product site, a vulnerability glossary, and a blog, but does not
  currently expose a public developer API, OpenAPI, SDKs, or documentation
  surface.
